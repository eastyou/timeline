[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "timeline"
version = "0.1.0"
description = "历史事件时间轴：CSV 生成可打印的 A4 时间轴"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["timeline", "history", "classroom", "printable", "teacher", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
timeline = "timeline.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/timeline"
Source = "https://github.com/eastyou/timeline"

[tool.setuptools]
packages = ["timeline"]
